version: '3'
services:
  postgres-core:
    image: postgres:16-alpine
    container_name: statify-postgres-core-local
    environment:
      POSTGRES_USER: ${STATIFY_CORE_POSTGRES_USER}
      POSTGRES_PASSWORD: ${STATIFY_CORE_POSTGRES_PASSWORD}
      POSTGRES_DB: statify-core
    ports:
      - "5432:5432"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres -d statify-core" ]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - postgres_core_data:/var/lib/postgresql/data
    networks:
      - app-network

  postgres-data-storage:
    build: .
    container_name: statify-postgres-data-storage-local
    environment:
      POSTGRES_USER: ${STATIFY_DATA_STORAGE_POSTGRES_USER}
      POSTGRES_PASSWORD: ${STATIFY_DATA_STORAGE_POSTGRES_PASSWORD}
      POSTGRES_DB: statify-data-storage
    ports:
      - "5433:5432"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres -d statify-data-storage" ]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - postgres_data_storage_data:/var/lib/postgresql/data
    networks:
      - app-network
    command:
      - "postgres"
      - "-c"
      - "shared_preload_libraries=pg_cron"
      - "-c"
      - "cron.database_name=statify-data-storage"

  kafka-init:
    image: busybox
    container_name: statify-kafka-init-local
    command: [ "sh", "-c", "chown -R 1001:1001 /tmp/kraft-combined-logs" ]
    volumes:
      - kafka-data:/tmp/kraft-combined-logs
    networks:
      - app-network

  kafka:
    image: soldevelo/kafka:3.7
    container_name: statify-kafka-local
    environment:
      KAFKA_CFG_NODE_ID: 1
      KAFKA_CFG_PROCESS_ROLES: broker,controller
      KAFKA_CFG_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_CFG_LISTENERS: INTERNAL://:9092,EXTERNAL://:9094,CONTROLLER://:9093
      KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_CFG_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CFG_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CFG_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://localhost:9094
      ALLOW_PLAINTEXT_LISTENER: "yes"
      KAFKA_CFG_LOG_DIRS: /tmp/kraft-combined-logs
      KAFKA_CFG_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_KRAFT_CLUSTER_ID: KAFKA_KRAFT_CLUSTER_ID
    healthcheck:
      test: [ "CMD-SHELL", "kafka-broker-api-versions.sh --bootstrap-server localhost:9094" ]
      interval: 10s
      timeout: 5s
      retries: 10
    depends_on:
      - kafka-init
    ports:
      - "9094:9094"
    volumes:
      - kafka-data:/tmp/kraft-combined-logs
    networks:
      - app-network

  kafdrop:
    image: obsidiandynamics/kafdrop:3.31.0
    container_name: statify-kafdrop-local
    environment:
      KAFKA_BROKER_CONNECT: kafka:9092
      JVM_OPTS: -Xms32M -Xmx64M
    ports:
      - "9000:9000"
    depends_on:
      kafka:
        condition: service_healthy
    networks:
      - app-network

  redis:
    image: redis:7-alpine
    container_name: statify-redis-local
    command: [ "redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD}" ]
    healthcheck:
      test: [ "CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5
    ports:
      - "${REDIS_PORT}:6379"
    networks:
      - app-network

  nginx:
    build:
      context: .
      dockerfile: nginx/Dockerfile.local
    container_name: statify-nginx-local
    ports:
      - "80:80"
    networks:
      - app-network

networks:
  app-network:
    driver: bridge

volumes:
  postgres_core_data:
  postgres_data_storage_data:
  kafka-data:
