version: '3'
services:
  postgres-core:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres # STATIFY_CORE_POSTGRES_USER
      POSTGRES_PASSWORD: Default123! # STATIFY_CORE_POSTGRES_PASSWORD
      POSTGRES_DB: statify-core
    ports:
      - "5432:5432"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres -d statify-core" ]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - postgres_core_data:/var/lib/postgresql/data
    networks:
      - app-network

  postgres-data-storage:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres # STATIFY_DATA_STORAGE_POSTGRES_USER
      POSTGRES_PASSWORD: Default123! # STATIFY_DATA_STORAGE_POSTGRES_PASSWORD
      POSTGRES_DB: statify-data-storage
    ports:
      - "5433:5432"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres -d statify-data-storage" ]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - postgres_data_storage_data:/var/lib/postgresql/data
    networks:
      - app-network

  kafka:
    image: bitnami/kafka:3.7
    environment:
      KAFKA_CFG_NODE_ID: 1
      KAFKA_CFG_PROCESS_ROLES: broker,controller
      KAFKA_CFG_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_CFG_LISTENERS: INTERNAL://:9092,EXTERNAL://:9094,CONTROLLER://:9093
      KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_CFG_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CFG_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CFG_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://localhost:9094
      ALLOW_PLAINTEXT_LISTENER: "yes"
      KAFKA_CFG_LOG_DIRS: /tmp/kraft-combined-logs
      KAFKA_CFG_AUTO_CREATE_TOPICS_ENABLE: "false"
    healthcheck:
      test: [ "CMD-SHELL", "kafka-broker-api-versions.sh --bootstrap-server localhost:9094" ]
      interval: 10s
      timeout: 5s
      retries: 10
    ports:
      - "9094:9094"
    networks:
      - app-network

  kafdrop:
    image: obsidiandynamics/kafdrop:3.31.0
    environment:
      KAFKA_BROKER_CONNECT: kafka:9092
      JVM_OPTS: -Xms32M -Xmx64M
    ports:
      - "9000:9000"
    depends_on:
      kafka:
        condition: service_healthy
    networks:
      - app-network

  redis:
    image: redis:7-alpine
    command: [ "redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD}" ]
    healthcheck:
      test: [ "CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5
    ports:
      - "${REDIS_PORT}:6379"
    networks:
      - app-network

  statify-core:
    build: ./statify-core
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SPRING_DATASOURCE_URL: ${STATIFY_CORE_POSTGRES_DOCKER_URL}
      POSTGRES_USER: ${STATIFY_CORE_POSTGRES_USER}
      POSTGRES_PASSWORD: ${STATIFY_CORE_POSTGRES_PASSWORD}
      SPRING_KAFKA_BOOTSTRAP_SERVERS: ${SPRING_KAFKA_BOOTSTRAP_SERVERS_DOCKER}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
      JWT_EXPIRATION_MS: ${JWT_EXPIRATION_MS}
      SPOTIFY_CLIENT_ID: ${SPOTIFY_CLIENT_ID}
      SPOTIFY_CLIENT_SECRET: ${SPOTIFY_CLIENT_SECRET}
      SPOTIFY_SCOPE: ${SPOTIFY_SCOPE}
      SERVER_PORT: ${STATIFY_CORE_PORT}
      SERVER_URL: ${STATIFY_CORE_URL}
      ENCRYPTION_PASSWORD: ${ENCRYPTION_PASSWORD}
      ENCRYPTION_SALT: ${ENCRYPTION_SALT}
    depends_on:
      postgres-core:
        condition: service_healthy
      kafka:
        condition: service_healthy
    healthcheck:
      test: [ "CMD-SHELL", "curl -f http://localhost:$${STATIFY_CORE_PORT}/actuator/health || exit 1" ]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - app-network

  statify-synchronizer:
    build: ./statify-synchronizer
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SPRING_DATASOURCE_URL: ${STATIFY_DATA_STORAGE_POSTGRES_DOCKER_R2DBC_URL}
      POSTGRES_USER: ${STATIFY_DATA_STORAGE_POSTGRES_USER}
      POSTGRES_PASSWORD: ${STATIFY_DATA_STORAGE_POSTGRES_PASSWORD}
      SPRING_KAFKA_BOOTSTRAP_SERVERS: ${SPRING_KAFKA_BOOTSTRAP_SERVERS_DOCKER}
      SERVER_PORT: ${STATIFY_SYNCHRONIZER_PORT}
      SPOTIFY_CLIENT_ID: ${SPOTIFY_CLIENT_ID}
      SPOTIFY_CLIENT_SECRET: ${SPOTIFY_CLIENT_SECRET}
      SPOTIFY_API_URL: ${SPOTIFY_API_URL}
      SPOTIFY_AUTH_URL: ${SPOTIFY_AUTH_URL}
      SPOTIFY_TIMEOUT_SECONDS: ${SPOTIFY_TIMEOUT_SECONDS}
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      REDIS_HOST: redis
      REDIS_PORT: ${REDIS_PORT}
    depends_on:
      postgres-data-storage:
        condition: service_healthy
      kafka:
        condition: service_healthy
      statify-data-api:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: [ "CMD-SHELL", "curl -f http://localhost:$${STATIFY_SYNCHRONIZER_PORT}/actuator/health || exit 1" ]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - app-network

networks:
  app-network:
    driver: bridge

volumes:
  postgres_core_data:
  postgres_data_storage_data: